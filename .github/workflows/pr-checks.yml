name: PR Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Compatibility and build checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10

      - name: Install dependencies from lockfile
        run: uv sync --locked

      - name: Compile sources
        run: uv run --no-sync python -m compileall -q bot.py config.py ModularBot

      # Build only: nothing is pushed to any registry here.
      - name: Build Docker image
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build --tag modular-bot:ci .

  auto-merge:
    name: Auto-merge Dependabot PR
    runs-on: ubuntu-latest
    needs: checks
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'lleans/modular-bot'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ github.token }}

      # Minor/patch only. After merging, the Image Builder is kicked off
      # explicitly because token-based merges don't fire a push event.
      - name: Merge PR and rebuild main image
        if: "steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          CURRENT_HEAD="$(gh pr view "$PR_URL" --json headRefOid --jq '.headRefOid')"
          if [ "$CURRENT_HEAD" != "$EXPECTED_HEAD" ]; then
            echo "::notice::PR head moved to $CURRENT_HEAD; the newer workflow run will handle it."
            exit 0
          fi
          gh pr merge "$PR_URL" --squash --delete-branch --match-head-commit "$EXPECTED_HEAD"
          gh workflow run build-image.yml --ref "$DEFAULT_BRANCH"
